# Copy to .github/workflows/pr-agent.yml in each repo you want reviewed.
# Runs the open-source PR-Agent on a SELF-HOSTED runner so it can reach your
# LiteLLM endpoint on the NetBird overlay.
name: PR-Agent

on:
  # pull_request_target (not pull_request): fork PRs run plain pull_request
  # workflows read-only with NO secrets, so PR-Agent exits silently without
  # posting anything (observed on Lacho00 fork PRs #28/#30/#31, 2026-09-01).
  # Safe here: the-pr-agent action reads the diff via GitHub API only and
  # never checks out or executes PR code, so fork code gets no privileged token.
  # The workflow file itself is always read from the BASE branch (main).
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:                 # lets you type /review, /improve, /ask in a PR comment

jobs:
  pr_agent_job:
    # Don't loop on the bot's own comments.
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: self-hosted         # <-- the critical line: runs on YOUR rig, not GitHub's cloud
    permissions:
      issues: write
      pull-requests: write
      contents: read
    name: PR-Agent review
    steps:
      - name: Run PR-Agent
        uses: the-pr-agent/pr-agent@main   # community-maintained OSS PR-Agent (Qodo donated it)
        env:
          # Auto-provided by GitHub; lets the bot read the diff and post comments.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Your LiteLLM virtual key (the ONLY secret). Add it in repo Settings →
          # Secrets and variables → Actions → New repository secret → name OPENAI_KEY.
          # Double underscore maps to openai.key in PR-Agent's config (dynaconf),
          # matching OPENAI__API_BASE below. Single-underscore OPENAI_KEY is NOT
          # picked up and the tool silently falls back to a 'dummy_key' → LiteLLM 401.
          OPENAI__KEY: ${{ secrets.OPENAI_KEY }}
          # Model + endpoint are also read from the committed .pr_agent.toml, but
          # setting them here too makes the workflow self-contained and overrides
          # the file if they ever drift. Double-underscore = nested config key.
          # Local 27B model generates a full review in ~5-6 min; the default
          # ai_timeout of 120s kills every attempt mid-generation and PR-Agent
          # posts "Failed to review PR" (observed on PR #28, 2026-09-01).
          CONFIG__AI_TIMEOUT: "900"
          CONFIG__MODEL: "openai/coder-plan"
          CONFIG__FALLBACK_MODELS: '["openai/coder-plan"]'
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: "65536"
          CONFIG__MAX_MODEL_TOKENS: "48000"
          # LiteLLM directly (NOT via Headroom :8788). Headroom short-circuits pr-agent's
          # request shape (returns empty 200, never forwards) — and since pr-agent uses the
          # LOCAL free Qwen, Headroom's token compression saves no cost here anyway.
          # 172.17.0.1 = Docker bridge gateway ("the host" from the action's container):
          # not a machine-specific IP, identical on every Docker host, leaks nothing.
          OPENAI__API_BASE: "http://172.17.0.1:4000/v1"
